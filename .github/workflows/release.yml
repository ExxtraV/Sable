name: Prepare release
on:
  workflow_dispatch:
    inputs:
      distribution:
        description: Apple signing mode (free account needs no Apple credentials)
        type: choice
        options: [community, notarized]
        default: community
        required: true
      version:
        description: 'Release version (for example 0.5.0)'
        required: true
      build:
        description: 'Build number, greater than every previously published build'
        required: true
permissions:
  contents: read
concurrency:
  group: sable-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
    env:
      DISTRIBUTION_MODE: ${{ inputs.distribution }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BUILD: ${{ inputs.build }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
      UPDATE_FEED_URL: https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml
      SIGNING_IDENTITY: ${{ inputs.distribution == 'notarized' && vars.SIGNING_IDENTITY || '-' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read public update configuration
        run: |
          python3 - <<'PY'
          import json, os
          config = json.load(open("UpdateConfig.json"))
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("SPARKLE_PUBLIC_KEY=" + config["publicKey"] + "\n")
          PY
      - name: Validate release configuration
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python3 scripts/check-release-config.py
      - name: Import distribution certificate into temporary keychain
        if: inputs.distribution == 'notarized'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, secrets, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          certificate = root / 'sable.p12'
          certificate.write_bytes(base64.b64decode(os.environ['CERTIFICATE'], validate=True))
          keychain = str(root / 'sable.keychain-db')
          password = secrets.token_urlsafe(32)
          def run(*args): subprocess.run(args, check=True, stdout=subprocess.DEVNULL)
          run('security', 'create-keychain', '-p', password, keychain)
          run('security', 'set-keychain-settings', '-lut', '21600', keychain)
          run('security', 'unlock-keychain', '-p', password, keychain)
          run('security', 'import', str(certificate), '-P', os.environ['CERTIFICATE_PASSWORD'], '-A', '-t', 'cert', '-f', 'pkcs12', '-k', keychain)
          run('security', 'set-key-partition-list', '-S', 'apple-tool:,apple:', '-k', password, keychain)
          run('security', 'list-keychains', '-d', 'user', '-s', keychain)
          run('xcrun', 'notarytool', 'store-credentials', 'sable-notary', '--keychain', keychain, '--apple-id', os.environ['APPLE_ID'], '--team-id', os.environ['APPLE_TEAM_ID'], '--password', os.environ['APPLE_APP_PASSWORD'])
          certificate.unlink()
          PY
      - name: Build universal app and test
        env:
          UNIVERSAL_BUILD: '1'
        run: |
          sh scripts/build-app.sh
          swift test --disable-sandbox
      - name: Package and sign update archive
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: sh scripts/prepare-release.sh
      - name: Create draft release for review
        run: |
          gh release create "v$RELEASE_VERSION" dist/Sable-Markdown-Writer.dmg dist/Sable-Markdown-Writer.zip dist/appcast.xml dist/Sable-Markdown-Writer.html dist/SHA256SUMS --draft --target "$GITHUB_SHA" --title "Sable Markdown Writer $RELEASE_VERSION" --notes-file docs/release-notes.md
      - name: Remove temporary signing materials
        if: always() && inputs.distribution == 'notarized'
        run: |
          security delete-keychain "$RUNNER_TEMP/sable.keychain-db" || true
          rm -f "$RUNNER_TEMP/sable.p12"
